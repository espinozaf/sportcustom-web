<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis pedidos | SPORTCUSTOM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <style>
    body {
        background: #070b12;
        color: #ffffff;
        font-family: Arial, sans-serif;
    }

    .pedidos-container {
        max-width: 1100px;
        margin: 50px auto;
        padding: 20px;
    }

    .pedidos-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        gap: 20px;
        flex-wrap: wrap;
    }

    .pedidos-header h1 {
        margin: 0;
        font-size: 42px;
        font-weight: 800;
        text-transform: uppercase;
        color: #ffffff;
    }

    .pedidos-header p {
        margin-top: 8px;
        color: #8fa0b8;
        font-size: 16px;
    }

    /* TARJETA DEL PEDIDO */
    .pedido-card {
        background: #0d1424;
        border: 1px solid #172a46;
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 22px;
        box-shadow: 0 0 25px rgba(0, 255, 180, 0.08);
        transition: 0.3s ease;
    }

    .pedido-card:hover {
        border-color: #8cff00;
        box-shadow: 0 0 30px rgba(140, 255, 0, 0.12);
        transform: translateY(-2px);
    }

    .pedido-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .pedido-numero {
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        text-transform: uppercase;
    }

    /* CAJAS DE INFORMACIÓN */
    .pedido-info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .info-box {
        background: #111a30;
        border: 1px solid #1b3150;
        border-radius: 9px;
        padding: 16px;
    }

    .info-box small {
        display: block;
        color: #71839e;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .info-box strong {
        color: #ffffff;
        font-size: 17px;
    }

    /* TOTAL */
    .info-box:last-child strong {
        color: #8cff00;
    }

    /* ESTADO */
    .estado {
        display: inline-block;
        padding: 7px 15px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .5px;
    }

    .estado-pendiente {
        background: rgba(140, 255, 0, 0.10);
        color: #8cff00;
        border: 1px solid #8cff00;
    }

    .estado-procesando {
        background: rgba(0, 210, 255, 0.10);
        color: #00d9ff;
        border: 1px solid #00d9ff;
    }

    .estado-enviado {
        background: rgba(0, 255, 190, 0.10);
        color: #00ffbe;
        border: 1px solid #00ffbe;
    }

    .estado-entregado {
        background: rgba(140, 255, 0, 0.10);
        color: #8cff00;
        border: 1px solid #8cff00;
    }

    .estado-cancelado {
        background: rgba(255, 70, 90, 0.10);
        color: #ff6478;
        border: 1px solid #ff6478;
    }

    /* BOTÓN MI CUENTA */
    .pedidos-header .btn {
        background: #111a30;
        border: 1px solid #1c3555;
        color: #ffffff;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 700;
        transition: .3s;
    }

    .pedidos-header .btn:hover {
        border-color: #8cff00;
        color: #8cff00;
        box-shadow: 0 0 15px rgba(140, 255, 0, 0.15);
    }

    /* SIN PEDIDOS */
    .sin-pedidos {
        background: #0d1424;
        border: 1px solid #172a46;
        border-radius: 14px;
        padding: 60px 20px;
        text-align: center;
    }

    .sin-pedidos i {
        font-size: 55px;
        color: #8cff00;
        display: block;
        margin-bottom: 18px;
    }

    .sin-pedidos h3 {
        color: #ffffff;
        font-weight: 700;
    }

    .sin-pedidos p {
        color: #8fa0b8;
    }

    .sin-pedidos .btn {
        background: linear-gradient(90deg, #8cff00, #00c896);
        border: none;
        color: #05080d;
        font-weight: 800;
        padding: 12px 22px;
        border-radius: 8px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {

        .pedidos-container {
            margin: 25px auto;
        }

        .pedidos-header h1 {
            font-size: 32px;
        }

        .pedido-info {
            grid-template-columns: 1fr;
        }

        .pedido-card {
            padding: 18px;
        }
    }
</style>
</head>

<body>

    <main class="pedidos-container">

        <div class="pedidos-header">
            <div>
                <h1>Mis pedidos</h1>
                <p>Consulta el historial de tus compras.</p>
            </div>

            <a href="cuenta.html" class="btn btn-dark">
                <i class="bi bi-person"></i>
                MI CUENTA
            </a>
        </div>

        <div id="listaPedidos">
            <div class="text-center py-5">
                <div class="spinner-border"></div>
                <p class="mt-3">Cargando pedidos...</p>
            </div>
        </div>

    </main>

    <script>

        function claseEstado(estado) {

            estado = String(estado || "").toLowerCase();

            if (estado === "pendiente") {
                return "estado-pendiente";
            }

            if (estado === "procesando" || estado === "en proceso") {
                return "estado-procesando";
            }

            if (estado === "enviado") {
                return "estado-enviado";
            }

            if (estado === "entregado") {
                return "estado-entregado";
            }

            if (estado === "cancelado") {
                return "estado-cancelado";
            }

            return "estado-pendiente";
        }


        fetch("../../backend/mis_pedidos.php", {
            credentials: "same-origin"
        })

        .then(response => response.json())

        .then(data => {

            const contenedor = document.getElementById("listaPedidos");

            if (!data.sesion) {
                window.location.href = "login.html";
                return;
            }

            if (!data.success || !data.pedidos || data.pedidos.length === 0) {

                contenedor.innerHTML = `
                    <div class="sin-pedidos">
                        <i class="bi bi-bag-x"></i>

                        <h3>No tienes pedidos todavía</h3>

                        <p>
                            Cuando realices una compra,
                            aparecerá aquí.
                        </p>

                        <a href="../productos/index.html"
                           class="btn btn-dark mt-3">
                            VER COLECCIÓN
                        </a>
                    </div>
                `;

                return;
            }


            contenedor.innerHTML = data.pedidos.map(pedido => {

                const estado = pedido.estado || "pendiente";

                return `
                    <div class="pedido-card">

                        <div class="pedido-top">

                            <div class="pedido-numero">
                                Pedido #${pedido.id}
                            </div>

                            <span class="estado ${claseEstado(estado)}">
                                ${estado}
                            </span>

                        </div>


                        <div class="pedido-info">

                            <div class="info-box">
                                <small>FECHA</small>
                                <strong>
                                    ${pedido.fecha_pedido}
                                </strong>
                            </div>

                            <div class="info-box">
                                <small>DESCUENTO</small>
                                <strong>
                                    $${parseFloat(pedido.descuento || 0).toFixed(2)}
                                </strong>
                            </div>

                            <div class="info-box">
                                <small>TOTAL</small>
                                <strong>
                                    $${parseFloat(pedido.total || 0).toFixed(2)}
                                </strong>
                            </div>

                        </div>

                    </div>
                `;

            }).join("");

        })

        .catch(error => {

            console.error(error);

            document.getElementById("listaPedidos").innerHTML = `
                <div class="sin-pedidos">
                    <i class="bi bi-exclamation-triangle"></i>

                    <h3>No se pudieron cargar los pedidos</h3>

                    <p>
                        Intenta nuevamente.
                    </p>
                </div>
            `;

        });

    </script>

</body>
</html>

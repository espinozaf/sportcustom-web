<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | SPORTCUSTOM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .auth-page {
            min-height: 100vh;
            padding: 70px 20px;
            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 70% 20%,
                    rgba(0,217,255,.08),
                    transparent 30%
                );
        }

        .auth-box {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 35px;

            border: 1px solid #1a3047;
            border-radius: 20px;

            background: #070f1a;

            box-shadow: 0 25px 60px rgba(0,0,0,.25);
        }

        .auth-kicker {
            color: #a3e635;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }

        .auth-box h1 {
            margin: 10px 0;

            color: white;

            font-size: 38px;
            font-weight: 900;
        }

        .auth-box h1 span {
            color: #a3e635;
        }

        .auth-description {
            margin-bottom: 30px;

            color: #718daa;

            font-size: 12px;
            line-height: 1.7;
        }

        .form-label-custom {
            display: block;

            margin-bottom: 7px;

            color: #7894af;

            font-family: "JetBrains Mono", monospace;

            font-size: 9px;
            font-weight: 700;
        }

        .auth-input {
            width: 100%;
            height: 46px;

            margin-bottom: 18px;

            padding: 0 13px;

            border: 1px solid #1b344d;
            border-radius: 8px;

            outline: none;

            background: #091522;
            color: white;
        }

        .auth-input:focus {
            border-color: #a3e635;
        }

        .auth-button {
            width: 100%;
            height: 52px;

            margin-top: 5px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                100deg,
                #a3e635,
                #00c68c
            );

            color: #06100b;

            font-size: 11px;
            font-weight: 900;

            cursor: pointer;
        }

        .auth-button:hover {
            opacity: .9;
        }

        .auth-footer {
            margin-top: 25px;

            text-align: center;

            color: #637f9b;

            font-size: 11px;
        }

        .auth-footer a {
            color: #a3e635;

            font-weight: 800;

            text-decoration: none;
        }

        .password-note {
            margin-top: -10px;
            margin-bottom: 18px;

            color: #506b86;

            font-size: 9px;
        }

        .message {
            display: none;

            margin-bottom: 20px;
            padding: 12px;

            border-radius: 8px;

            font-size: 11px;
            font-weight: 700;

            text-align: center;
        }

        .message.success {
            display: block;

            background: rgba(163,230,53,.10);

            border: 1px solid #527d27;

            color: #a3e635;
        }

        .message.error {
            display: block;

            background: rgba(255,70,90,.10);

            border: 1px solid #7d2733;

            color: #ff7080;
        }

    </style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="main-header">

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a href="../index.html" class="brand">

                <div class="brand-symbol">
                    S
                </div>

                <div class="brand-text">

                    <strong>
                        SPORT<span>CUSTOM</span>
                    </strong>

                    <small>
                        REMARKABLE UNIFORMS
                    </small>

                </div>

            </a>

        </div>

    </nav>

</header>



<!-- ==================================================
     REGISTRO
================================================== -->

<main>

<section class="auth-page">

    <div class="auth-box">

        <div class="auth-kicker">
            REMARKABLE ACCOUNT
        </div>


        <h1>
            CREA TU <span>CUENTA.</span>
        </h1>


        <p class="auth-description">

            Regístrate para guardar tus diseños,
            realizar pedidos y consultar el estado
            de tus compras.

        </p>


        <!-- MENSAJE -->

        <div id="message" class="message"></div>



        <!-- ==================================================
             FORMULARIO
        ================================================== -->

        <form id="registerForm">


            <!-- NOMBRE -->

            <label
                class="form-label-custom"
                for="nombre">

                NOMBRE COMPLETO

            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                class="auth-input"
                placeholder="Ej. Javiera Espinoza"
                required>



            <!-- CORREO -->

            <label
                class="form-label-custom"
                for="correo">

                CORREO ELECTRÓNICO

            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                class="auth-input"
                placeholder="correo@ejemplo.com"
                required>



            <!-- TELÉFONO -->

            <label
                class="form-label-custom"
                for="telefono">

                TELÉFONO

            </label>

            <input
                type="tel"
                id="telefono"
                name="telefono"
                class="auth-input"
                placeholder="+505 0000-0000"
                required>



            <!-- DIRECCIÓN -->

            <label
                class="form-label-custom"
                for="direccion">

                DIRECCIÓN

            </label>

            <input
                type="text"
                id="direccion"
                name="direccion"
                class="auth-input"
                placeholder="Managua, Nicaragua"
                required>



            <!-- CONTRASEÑA -->

            <label
                class="form-label-custom"
                for="password">

                CONTRASEÑA

            </label>

            <input
                type="password"
                id="password"
                name="password"
                class="auth-input"
                placeholder="Mínimo 8 caracteres"
                minlength="8"
                required>


            <div class="password-note">

                La contraseña debe tener al menos
                8 caracteres.

            </div>



            <!-- CONFIRMAR -->

            <label
                class="form-label-custom"
                for="confirmPassword">

                CONFIRMAR CONTRASEÑA

            </label>

            <input
                type="password"
                id="confirmPassword"
                class="auth-input"
                placeholder="Repite tu contraseña"
                minlength="8"
                required>



            <!-- BOTÓN -->

            <button
                type="submit"
                class="auth-button">

                CREAR MI CUENTA

                <i class="bi bi-arrow-right"></i>

            </button>


        </form>



        <!-- LOGIN -->

        <div class="auth-footer">

            ¿Ya tienes una cuenta?

            <a href="login.html">

                INICIAR SESIÓN

            </a>

        </div>

    </div>

</section>

</main>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>

const registerForm =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* =========================================
           CONTRASEÑAS
        ========================================= */

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (password !== confirmPassword) {

            message.className =
                "message error";

            message.textContent =
                "Las contraseñas no coinciden.";

            return;

        }


        if (password.length < 8) {

            message.className =
                "message error";

            message.textContent =
                "La contraseña debe tener al menos 8 caracteres.";

            return;

        }


        /* =========================================
           DATOS DEL FORMULARIO
        ========================================= */

        const datos = new FormData();

        datos.append(
            "nombre",
            document.getElementById("nombre").value
        );

        datos.append(
            "correo",
            document.getElementById("correo").value
        );

        datos.append(
            "telefono",
            document.getElementById("telefono").value
        );

        datos.append(
            "direccion",
            document.getElementById("direccion").value
        );

        datos.append(
            "password",
            password
        );


        /* =========================================
           ENVIAR A PHP
        ========================================= */

        try {

            const respuesta = await fetch(
                "../../backend/registro.php",
                {
                    method: "POST",
                    body: datos
                }
            );


            const resultado =
                await respuesta.text();
                
                console.log("Respuesta PHP:", resultado);
                console.log("Estado HTTP:", respuesta.status);  


            /* =========================================
               REGISTRO CORRECTO
            ========================================= */

            if (
                resultado.includes(
                    "REGISTRO_EXITOSO"
                )
            ) {

                message.className =
                    "message success";

                message.textContent =
                    "¡Cuenta creada correctamente! Redirigiendo...";


                registerForm.reset();


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1800);


            } else {

                message.className =
                    "message error";

                message.textContent =
                    resultado;

            }


        } catch (error) {

            message.className =
                "message error";

            message.textContent =
                "No se pudo conectar con el servidor.";

            console.error(error);

        }

    }
);

</script>


</body>

</html>

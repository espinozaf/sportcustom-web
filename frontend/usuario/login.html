<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | SPORTCUSTOM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">


    <style>

        .auth-page {
            min-height: 100vh;
            padding: 70px 20px;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 30% 20%,
                    rgba(163,230,53,.07),
                    transparent 30%
                );
        }


        /* =========================================
           NAVEGACIÓN DEL LOGIN
        ========================================= */

        .auth-nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 22px;
            margin-left: auto;
        }

        .auth-nav a {
            color: #7894af;
            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 9px;
            font-weight: 700;

            text-decoration: none;
            letter-spacing: .4px;

            transition: .2s ease;
        }

        .auth-nav a:hover {
            color: #a3e635;
        }

        .auth-nav .auth-home {
            color: #00d9ff;
        }

        .auth-nav .auth-home i {
            margin-right: 5px;
        }


        /* =========================================
           CAJA LOGIN
        ========================================= */

        .auth-box {
            width: 100%;
            max-width: 450px;

            margin: auto;
            padding: 35px;

            border: 1px solid #1a3047;
            border-radius: 20px;

            background: #070f1a;
        }


        .auth-kicker {

            color: #a3e635;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }


        .auth-box h1 {

            margin: 10px 0;

            color: white;

            font-size: 38px;
            font-weight: 900;
        }


        .auth-box h1 span {
            color: #00d9ff;
        }


        .auth-description {

            margin-bottom: 30px;

            color: #718daa;

            font-size: 12px;
            line-height: 1.7;
        }


        .form-label-custom {

            display: block;

            margin-bottom: 7px;

            color: #7894af;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 9px;
            font-weight: 700;
        }


        .auth-input {

            width: 100%;
            height: 48px;

            margin-bottom: 20px;
            padding: 0 13px;

            border: 1px solid #1b344d;
            border-radius: 8px;

            outline: none;

            background: #091522;
            color: white;
        }


        .auth-input:focus {
            border-color: #a3e635;
        }


        .auth-button {

            width: 100%;
            height: 52px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    100deg,
                    #a3e635,
                    #00c68c
                );

            color: #06100b;

            font-size: 11px;
            font-weight: 900;

            cursor: pointer;
        }


        .auth-button:disabled {

            opacity: .6;
            cursor: not-allowed;
        }


        .forgot-password {

            display: block;

            margin: -5px 0 20px;

            color: #00d9ff;

            font-size: 9px;

            text-align: right;

            text-decoration: none;
        }


        .auth-footer {

            margin-top: 25px;

            text-align: center;

            color: #637f9b;

            font-size: 11px;
        }


        .auth-footer a {

            color: #a3e635;

            font-weight: 800;

            text-decoration: none;
        }


        /* =========================================
           MENSAJE
        ========================================= */

        .login-message {

            display: none;

            margin-bottom: 20px;
            padding: 12px 14px;

            border-radius: 8px;

            font-size: 11px;
            line-height: 1.5;
        }


        .login-message.success {

            display: block;

            border: 1px solid
                rgba(163,230,53,.35);

            background:
                rgba(163,230,53,.08);

            color: #a3e635;
        }


        .login-message.error {

            display: block;

            border: 1px solid
                rgba(255,70,70,.35);

            background:
                rgba(255,70,70,.08);

            color: #ff7777;
        }


        /* =========================================
           MÓVIL
        ========================================= */

        @media (max-width: 700px) {

            .auth-nav {
                gap: 10px;
            }

            .auth-nav a {
                font-size: 8px;
            }

            .auth-nav a:nth-child(n+3) {
                display: none;
            }

        }

    </style>

</head>


<body>


<header class="main-header">

    <nav class="navbar navbar-expand-lg">

        <div class="container">


            <!-- LOGO -->
            <a
                href="../index.html"
                class="brand">

                <div class="brand-symbol">
                    S
                </div>

                <div class="brand-text">

                    <strong>
                        SPORT<span>CUSTOM</span>
                    </strong>

                    <small>
                        REMARKABLE UNIFORMS
                    </small>

                </div>

            </a>


            <!-- =====================================
                 NAVEGACIÓN AGREGADA
                 ===================================== -->

            <div class="auth-nav">

                <a
                    href="../index.html"
                    class="auth-home">

                    <i class="bi bi-house"></i>

                    INICIO

                </a>


                <a href="../productos/index.html">

                    CATÁLOGO

                </a>


                <a href="../personalizador/index.html">

                    PERSONALIZAR

                </a>


                <a href="../contacto/index.html">

                    CONTACTO

                </a>

            </div>


        </div>

    </nav>

</header>



<main>

<section class="auth-page">


    <div class="auth-box">


        <div class="auth-kicker">

            REMARKABLE ACCOUNT

        </div>



        <h1>

            INICIAR <span>SESIÓN.</span>

        </h1>



        <p class="auth-description">

            Accede a tu cuenta para administrar tus diseños
            y pedidos de SPORTCUSTOM.

        </p>



        <!-- =====================================
             MENSAJE DE LOGIN
        ====================================== -->

        <div
            id="loginMessage"
            class="login-message">
        </div>



        <!-- =====================================
             FORMULARIO
        ====================================== -->

        <form id="loginForm">


            <label class="form-label-custom">

                CORREO ELECTRÓNICO

            </label>



            <input
                type="email"
                id="correo"
                class="auth-input"
                placeholder="correo@ejemplo.com"
                required>



            <label class="form-label-custom">

                CONTRASEÑA

            </label>



            <input
                type="password"
                id="password"
                class="auth-input"
                placeholder="Tu contraseña"
                required>



            <a
                href="#"
                class="forgot-password">

                ¿OLVIDASTE TU CONTRASEÑA?

            </a>



            <button
                type="submit"
                class="auth-button"
                id="loginButton">

                INICIAR SESIÓN

                <i class="bi bi-arrow-right"></i>

            </button>


        </form>



        <div class="auth-footer">

            ¿Todavía no tienes una cuenta?

            <a href="registro.html">

                REGÍSTRATE

            </a>

        </div>


    </div>


</section>

</main>



<script>


/* =========================================
   LOGIN SPORTCUSTOM
========================================= */


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();



            const correo =
                document
                    .getElementById("correo")
                    .value
                    .trim();



            const password =
                document
                    .getElementById("password")
                    .value;



            const message =
                document
                    .getElementById("loginMessage");



            const button =
                document
                    .getElementById("loginButton");



            /* =====================================
               VALIDAR
            ===================================== */


            if (!correo || !password) {

                message.className =
                    "login-message error";

                message.textContent =
                    "Debes completar el correo y la contraseña.";

                return;

            }



            /* =====================================
               BOTÓN
            ===================================== */


            button.disabled = true;

            button.innerHTML = `

                INICIANDO SESIÓN...

                <i class="bi bi-arrow-repeat"></i>

            `;



            /* =====================================
               FORM DATA
            ===================================== */


            const datos =
                new FormData();



            datos.append(
                "correo",
                correo
            );



            datos.append(
                "password",
                password
            );



            try {


                /* =================================
                   LOGIN
                ================================= */


                const respuestaLogin =
                    await fetch(
                        "../../backend/login.php",
                        {
                            method: "POST",

                            body: datos,

                            credentials: "same-origin"
                        }
                    );



                const resultadoLogin =
                    await respuestaLogin.text();



                console.log(
                    "Respuesta login.php:",
                    resultadoLogin
                );



                /* =================================
                   COMPROBAR LOGIN
                ================================= */


                if (
                    !resultadoLogin.includes(
                        "LOGIN_EXITOSO"
                    )
                ) {


                    message.className =
                        "login-message error";


                    message.textContent =
                        resultadoLogin ||
                        "El correo o la contraseña son incorrectos.";


                    button.disabled = false;


                    button.innerHTML = `

                        INICIAR SESIÓN

                        <i class="bi bi-arrow-right"></i>

                    `;


                    return;

                }



                /* =================================
                   COMPROBAR ADMINISTRADOR
                ================================= */


                const respuestaAdmin =
                    await fetch(
                        "../../backend/admin_auth.php",
                        {
                            method: "GET",

                            credentials: "same-origin",

                            cache: "no-store"
                        }
                    );



                const resultadoAdmin =
                    await respuestaAdmin.json();



                console.log(
                    "Respuesta admin_auth.php:",
                    resultadoAdmin
                );



                /* =================================
                   ADMINISTRADOR
                ================================= */


                if (
                    resultadoAdmin.success === true &&
                    resultadoAdmin.admin === true
                ) {


                    message.className =
                        "login-message success";


                    message.textContent =
                        "¡Bienvenido, administrador!";


                    setTimeout(
                        function() {

                            window.location.href =
                                "../admin/index.html";

                        },
                        700
                    );


                    return;

                }



                /* =================================
                   CLIENTE NORMAL
                ================================= */


                message.className =
                    "login-message success";


                message.textContent =
                    "¡Bienvenido a SPORTCUSTOM!";


                setTimeout(
                    function() {

                        window.location.href =
                            "cuenta.html";

                    },
                    700
                );


            }


            catch (error) {


                console.error(
                    "Error:",
                    error
                );


                message.className =
                    "login-message error";


                message.textContent =
                    "No se pudo conectar con el servidor.";


                button.disabled = false;


                button.innerHTML = `

                    INICIAR SESIÓN

                    <i class="bi bi-arrow-right"></i>

                `;

            }

        }

    );


</script>


</body>

</html>
